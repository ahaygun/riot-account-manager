[package]
name = "quickswitch-core"
version = "0.3.6"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
# native-tls uses Windows' own TLS (schannel): no C toolchain extras needed.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
# Optional app lock: key from a master password, authenticated encryption.
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
