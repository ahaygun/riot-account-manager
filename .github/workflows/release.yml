# Builds the Windows installer and publishes it as a GitHub Release.
#
# To release: raise "version" in src-tauri/tauri.conf.json and push to main.
# If no release exists for that version yet, this builds one and tags it.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-release-

      - name: Test
        run: cargo test --workspace --locked

      - name: Install Tauri CLI
        if: steps.version.outputs.publish == 'true'
        run: npm install --global @tauri-apps/cli@2

      - name: Build installer
        if: steps.version.outputs.publish == 'true'
        run: tauri build

      - name: Checksums
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          cd target/release/bundle/nsis
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            target/release/bundle/nsis/*.exe target/release/bundle/nsis/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "QuickSwitch ${{ steps.version.outputs.tag }}" \
            --notes "Kurulum: aşağıdaki \`setup.exe\` dosyasını indirip çalıştır. Windows \"bilinmeyen yayıncı\" uyarısı gösterirse **Ek bilgi**, sonra **Yine de çalıştır**. Dosyanın bozulmadığını \`SHA256SUMS.txt\` ile karşılaştırabilirsin."
