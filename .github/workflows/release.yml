# Builds the Windows installer and publishes it as a GitHub Release.
# Runs when a version tag is pushed, for example:  git tag v0.3.0 && git push origin v0.3.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-release-

      - name: Test
        run: cargo test --workspace --locked

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2

      - name: Build installer
        run: tauri build

      - name: Checksums
        shell: bash
        run: |
          cd target/release/bundle/nsis
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Keep installer as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: target/release/bundle/nsis/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/release/bundle/nsis/*.exe target/release/bundle/nsis/SHA256SUMS.txt \
            --title "QuickSwitch $GITHUB_REF_NAME" \
            --notes "Kurulum: aşağıdaki \`setup.exe\` dosyasını indirip çalıştır. Windows \"bilinmeyen yayıncı\" uyarısı gösterirse **Ek bilgi**, sonra **Yine de çalıştır**. Dosyanın bozulmadığını \`SHA256SUMS.txt\` ile karşılaştırabilirsin."
