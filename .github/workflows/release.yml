# Builds the Windows installer and publishes it as a GitHub Release.
#
# To release: raise "version" in src-tauri/tauri.conf.json and push to main.
# If no release exists for that version yet, this builds one and tags it.
#
# Auto-update is switched on by two repository settings (Settings > Secrets
# and variables > Actions). With both present, the installer is signed, the
# app is built with the updater enabled, and `latest.json` is published for
# installed copies to find. Without them the app is built with no updater
# and never goes online. See docs/UPDATES.md.
#   variable  UPDATE_PUBKEY                        public key (not a secret)
#   secret    TAURI_SIGNING_PRIVATE_KEY            private key
#   secret    TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its password
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-release-

      - name: Test
        run: cargo test --workspace --locked

      - name: Install Tauri CLI
        if: steps.version.outputs.publish == 'true'
        run: npm install --global @tauri-apps/cli@2

      # The cache can carry installers of earlier versions; start clean so
      # only this version's file is published.
      - name: Build installer
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          UPDATE_PUBKEY: ${{ vars.UPDATE_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          rm -rf target/release/bundle
          if [ -n "$UPDATE_PUBKEY" ] && [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Update signing key found: building with auto-update."
            jq -n --arg key "$UPDATE_PUBKEY" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" \
              '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $key, endpoints: [$url]}}}' \
              > "$RUNNER_TEMP/updater.json"
            tauri build --config "$RUNNER_TEMP/updater.json"
          else
            echo "No update signing key configured: building without auto-update."
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            tauri build
          fi

      # What installed copies download to learn about this version. Only
      # written when the installer was signed.
      - name: Update manifest
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          cd target/release/bundle/nsis
          exe=$(ls *-setup.exe)
          if [ -f "$exe.sig" ]; then
            jq -n --arg version "${{ steps.version.outputs.version }}" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg signature "$(cat "$exe.sig")" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/${{ steps.version.outputs.tag }}/$exe" \
              '{version: $version, pub_date: $date, platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
              > latest.json
            cat latest.json
          else
            echo "Installer is not signed; no update manifest."
          fi

      - name: Checksums
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          cd target/release/bundle/nsis
          sha256sum *-setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          exe=$(cd target/release/bundle/nsis && ls *-setup.exe)
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          **İndir:** [\`$exe\`](https://github.com/$GITHUB_REPOSITORY/releases/download/${{ steps.version.outputs.tag }}/$exe)

          Çalıştır. Windows "bilinmeyen yayıncı" uyarısı gösterirse **Ek bilgi**, sonra **Yine de çalıştır**. Kurulu sürümün varsa üstüne kurulur; hesapların ve ayarların korunur.

          Diğer dosyaları indirmen gerekmez: \`latest.json\` ve \`.sig\` uygulamanın otomatik güncellemesi içindir, \`SHA256SUMS.txt\` ise indirilen dosyanın bozulmadığını elle denetlemek isteyenler için.
          NOTES
          cd target/release/bundle/nsis
          files=(*-setup.exe SHA256SUMS.txt)
          [ -f latest.json ] && files+=(latest.json *-setup.exe.sig)
          gh release create "${{ steps.version.outputs.tag }}" "${files[@]}" \
            --target "$GITHUB_SHA" \
            --title "QuickSwitch ${{ steps.version.outputs.tag }}" \
            --notes-file "$RUNNER_TEMP/notes.md"
